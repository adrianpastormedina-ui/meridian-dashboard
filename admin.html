<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 1rem;
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Gradient for Income Panel */
        .income-gradient {
            background: linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
            border: 1px solid #D4AF37;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3 cursor-pointer" onclick="showMainDashboard()">
                    <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 15 L55 35 L75 35 L60 48 L65 68 L50 55 L35 68 L40 48 L25 35 L45 35 Z" fill="#0B132B"/>
                        <rect x="46" y="55" width="8" height="40" fill="#D4AF37"/>
                        <rect x="34" y="50" width="8" height="45" fill="#D4AF37"/>
                        <rect x="58" y="50" width="8" height="45" fill="#D4AF37"/>
                        <rect x="22" y="45" width="8" height="50" fill="#D4AF37"/>
                        <rect x="70" y="45" width="8" height="50" fill="#D4AF37"/>
                    </svg>
                    <div>
                        <h1 class="text-xl font-bold leading-tight" style="color: #0B132B;">Control Panel</h1>
                        <p class="text-xs text-slate-500 font-medium">Administrator: Adrian Pastor</p>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="btnSignOut" class="text-sm font-medium text-slate-500 hover:text-red-600 transition-colors flex items-center gap-2">
                        Sign Out <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full" id="mainView">
        
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 fade-in" style="animation-delay: 0.1s">
            <div class="glass-card p-6 flex items-center gap-4 transform transition hover:-translate-y-1 hover:shadow-lg">
                <div class="w-14 h-14 bg-green-100 text-green-600 rounded-2xl flex items-center justify-center">
                    <i data-lucide="dollar-sign" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Total Income</p>
                    <h3 class="text-3xl font-extrabold text-slate-800" id="globalIncome">$ 0.00</h3>
                </div>
            </div>
            <div class="glass-card p-6 flex items-center gap-4 transform transition hover:-translate-y-1 hover:shadow-lg">
                <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Active Students</p>
                    <h3 class="text-3xl font-extrabold text-slate-800" id="globalStudents">2</h3>
                </div>
            </div>
            <div class="glass-card p-6 flex items-center gap-4 transform transition hover:-translate-y-1 hover:shadow-lg">
                <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center">
                    <i data-lucide="package" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider">Packages Sold</p>
                    <h3 class="text-3xl font-extrabold text-slate-800" id="globalPackages">0</h3>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between mb-6 fade-in" style="animation-delay: 0.2s">
            <h2 class="text-2xl font-extrabold tracking-tight" style="color: #0B132B;">Student Management</h2>
            <button class="bg-[#0B132B] hover:bg-[#1C2541] text-[#D4AF37] px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Add Student
            </button>
        </div>

        <!-- Student Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in" style="animation-delay: 0.3s" id="studentGrid">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- Student Detail View (Hidden by default) -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full hidden fade-in" id="studentDetailView">
        <button onclick="showMainDashboard()" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-slate-800 font-bold transition">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Dashboard
        </button>

        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-2 text-center tracking-tight">Session Tracker</h1>
        <p class="text-slate-500 text-center mb-8 font-medium" id="detailStudentName">Student Name — Progress & Packages</p>
        
        <!-- Income Panel for this student -->
        <div class="income-gradient text-white p-6 rounded-2xl shadow-xl mb-8 text-center transform transition hover:scale-[1.02]">
            <h3 class="text-xs uppercase tracking-widest font-bold opacity-85">Recorded Income</h3>
            <p id="studentTotalSoles" class="text-4xl font-extrabold mt-1 drop-shadow-sm">0.00</p>
        </div>

        <!-- Packages Container -->
        <div id="contenedorPaquetes" class="space-y-8"></div>
    </main>

    <!-- AI Report Assistant Modal -->
    <div id="modalReporteIA" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 transform transition-all scale-95 opacity-0 duration-300" id="modalBox">
            <!-- Header -->
            <div class="bg-gradient-to-r from-amber-400 to-yellow-500 p-5 text-slate-900 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-xl">
                        <i data-lucide="bot" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-lg">AI Report Assistant</h3>
                        <p id="modalSubtitulo" class="text-xs font-bold opacity-80 text-amber-950">Report for Parents</p>
                    </div>
                </div>
                <button onclick="cerrarModal()" class="text-amber-950 hover:bg-black/10 w-8 h-8 rounded-full flex items-center justify-center transition font-bold">&times;</button>
            </div>

            <!-- Form -->
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🚀 Progress in this session (for parents)</label>
                    <textarea id="inputAvances" rows="3" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none text-sm text-slate-700 transition bg-slate-50 focus:bg-white" placeholder="Ex: We looked for info for the essay and structured the main ideas."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">🤝 Agreements (for next session)</label>
                    <textarea id="inputAcuerdos" rows="2" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-400 focus:border-transparent outline-none text-sm text-slate-700 transition bg-slate-50 focus:bg-white" placeholder="Ex: Continue writing the structure tomorrow."></textarea>
                </div>

                <!-- Alert -->
                <div id="modalAlerta" class="hidden text-xs text-red-600 font-bold bg-red-50 p-3 rounded-xl border border-red-200 flex items-start gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <span id="alertaTexto"></span>
                </div>

                <div class="flex gap-3 pt-2">
                    <button id="btnConfirmar" onclick="generarReporteConGemini()" class="flex-1 bg-amber-400 hover:bg-amber-500 active:bg-amber-600 text-amber-950 font-extrabold py-3 px-4 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <span>Generate with AI</span> <i data-lucide="sparkles" class="w-4 h-4"></i>
                    </button>
                    <button onclick="cerrarModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 px-4 rounded-xl transition">
                        Cancel
                    </button>
                </div>

                <!-- Result Section -->
                <div id="seccionResultado" class="hidden space-y-3 pt-5 mt-2 border-t border-slate-100 fade-in">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1"><i data-lucide="message-square" class="w-3 h-3"></i> Drafted Message:</label>
                        <span class="text-[10px] bg-emerald-100 text-emerald-800 font-extrabold px-2 py-1 rounded-md uppercase tracking-wide">Ready</span>
                    </div>
                    <textarea id="resultadoIAText" rows="6" readonly class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 outline-none resize-none font-medium leading-relaxed"></textarea>
                    <button id="btnCopiar" onclick="copiarMensajeAlPortapapeles()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl transition shadow flex items-center justify-center gap-2">
                        Copy Message <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Data Mock for Students
        const mockStudents = [
            {
                id: '1',
                name: 'Diego Hernández',
                currency: 'Soles',
                packages: [
                    {
                        tipo: "Trabajos", numero: 1, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '30/05/2026', horaInicio: '18:00', horaFin: '20:00', min: 120, info: "Monografía - Física"},
                            {fecha: '31/05/2026', horaInicio: '08:00', horaFin: '12:00', min: 240, info: "Monografía - Física"}
                        ]
                    },
                    {
                        tipo: "Trabajos", numero: 2, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '31/05/2026', horaInicio: '15:00', horaFin: '18:00', min: 180, info: "Monografía - Física"},
                            {fecha: '01/06/2026', horaInicio: '16:00', horaFin: '19:00', min: 180, info: "Monografía - Física"}
                        ]
                    },
                    {
                        tipo: "Trabajos", numero: 3, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '01/06/2026', horaInicio: '19:00', horaFin: '21:00', min: 120, info: "Monografía - Física"},
                            {fecha: '03/05/2026', horaInicio: '16:00', horaFin: '20:00', min: 240, info: "Monografía - Física"}
                        ]
                    },
                    {
                        tipo: "Trabajos", numero: 4, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '04/06/2026', horaInicio: '21:00', horaFin: '22:10', min: 70, info: "Monografía - Física"},
                            {fecha: '06/06/2026', horaInicio: '10:50', horaFin: '13:00', min: 130, info: "Monografía - Física"},
                            {fecha: '06/06/2026', horaInicio: '15:00', horaFin: '17:40', min: 160, info: "Monografía - Física"}
                        ]
                    },
                    {
                        tipo: "Trabajos", numero: 5, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '06/06/2026', horaInicio: '17:40', horaFin: '18:40', min: 60, info: "Interno - Historia"},
                            {fecha: '07/06/2026', horaInicio: '09:30', horaFin: '13:30', min: 240, info: "Interno - Historia"},
                            {fecha: '07/06/2026', horaInicio: '19:30', horaFin: '20:30', min: 60, info: "Interno - Historia"}
                        ]
                    },
                    {
                        tipo: "Trabajos", numero: 6, maxMin: 360, costoMax: 500, isPaid: true,
                        sesiones: [
                            {fecha: '07/06/2026', horaInicio: '20:30', horaFin: '22:00', min: 90, info: "Ensayo - TdC"},
                            {fecha: '08/06/2026', horaInicio: '17:30', horaFin: '20:10', min: 160, info: "Ensayo - TdC"},
                            {fecha: '08/06/2026', horaInicio: '21:20', horaFin: '22:10', min: 50, info: "Ensayo - TdC"}
                        ]
                    },
                    {
                        tipo: "Clases", numero: 1, maxMin: 180, costoMax: 220, isPaid: true,
                        sesiones: [
                            {fecha: '09/06/2026', horaInicio: '17:30', horaFin: '20:30', min: 180, info: "Ensayo - TdC"}
                        ]
                    }
                ]
            },
            {
                id: '2',
                name: 'Sofia Ruiz',
                currency: 'USD',
                packages: [
                    {
                        tipo: "Clases", numero: 1, maxMin: 360, costoMax: 120, isPaid: true,
                        sesiones: [
                            {fecha: '10/06/2026', horaInicio: '10:00', horaFin: '12:00', min: 120, info: "Math Tutoring"}
                        ]
                    }
                ]
            }
        ];

        const colores = ['border-red-500', 'border-blue-500', 'border-green-500', 'border-yellow-500', 'border-purple-500', 'border-pink-500', 'border-cyan-500'];
        let sesionSeleccionada = null;

        function renderMainDashboard() {
            const grid = document.getElementById('studentGrid');
            let globalIncome = 0;
            let globalPackages = 0;

            grid.innerHTML = mockStudents.map(student => {
                const packages = student.packages;
                let studentIncome = 0;
                
                packages.forEach(p => {
                    const totalMins = p.sesiones.reduce((acc, curr) => acc + curr.min, 0);
                    const costo = (totalMins / p.maxMin) * p.costoMax;
                    if (p.isPaid) {
                        studentIncome += costo;
                        globalIncome += costo;
                    }
                });
                
                globalPackages += packages.length;
                
                const currentPackage = packages[packages.length - 1];
                const totalMinsCurrent = currentPackage.sesiones.reduce((acc, curr) => acc + curr.min, 0);

                return `
                    <div class="glass-card p-6 flex flex-col justify-between group cursor-pointer transform transition hover:-translate-y-1 hover:shadow-xl hover:border-blue-200" onclick="openStudentDetail('${student.id}')">
                        <div>
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-12 h-12 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-xl shadow-md">
                                    ${student.name.charAt(0)}
                                </div>
                                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-md">Active</span>
                            </div>
                            <h3 class="text-lg font-extrabold text-slate-800 mb-1">${student.name}</h3>
                            <p class="text-sm text-slate-500 font-medium mb-4">Total Income: ${studentIncome.toFixed(2)} ${student.currency}</p>
                            
                            <div class="bg-slate-50 rounded-xl p-3 border border-slate-100 mb-4">
                                <div class="flex justify-between text-xs font-bold mb-1">
                                    <span class="text-slate-500 uppercase tracking-wider">Pkg ${currentPackage.tipo} #${currentPackage.numero}</span>
                                    <span class="text-blue-600">${Math.floor(totalMinsCurrent/60)}h ${totalMinsCurrent%60}m / ${currentPackage.maxMin/60}h</span>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                    <div class="bg-blue-600 h-2 rounded-full transition-all duration-1000" style="width: ${(totalMinsCurrent / currentPackage.maxMin) * 100}%"></div>
                                </div>
                            </div>
                        </div>
                        <button class="w-full py-2.5 bg-slate-100 group-hover:bg-blue-600 text-slate-600 group-hover:text-white rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-2">
                            View Progress <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');

            document.getElementById('globalIncome').innerText = `$ ${globalIncome.toFixed(2)}`;
            document.getElementById('globalStudents').innerText = mockStudents.length;
            document.getElementById('globalPackages').innerText = globalPackages;
            lucide.createIcons();
        }

        function showMainDashboard() {
            document.getElementById('studentDetailView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function openStudentDetail(studentId) {
            const student = mockStudents.find(s => s.id === studentId);
            if(!student) return;

            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('studentDetailView').classList.remove('hidden');
            window.scrollTo(0,0);

            document.getElementById('detailStudentName').innerText = `${student.name} — Progress & Packages`;
            
            const paquetes = student.packages;
            const contenedor = document.getElementById('contenedorPaquetes');
            let ingresosTotales = 0;
            const paquetesReversed = [...paquetes].reverse();
            
            contenedor.innerHTML = paquetesReversed.map((p, i) => {
                const totalMins = p.sesiones.reduce((acc, curr) => acc + curr.min, 0);
                const costo = (totalMins / p.maxMin) * p.costoMax;
                if (p.isPaid) ingresosTotales += costo;
                
                const isComplete = totalMins >= p.maxMin;
                const colorMonto = p.isPaid ? 'text-blue-600 font-extrabold' : 'text-slate-400 font-bold';
                
                const sesionesOrdenadas = [...p.sesiones].sort((a, b) => {
                    const dateA = new Date(a.fecha.split('/').reverse().join('-') + 'T' + a.horaInicio);
                    const dateB = new Date(b.fecha.split('/').reverse().join('-') + 'T' + b.horaInicio);
                    return dateB - dateA;
                });

                return `
                    <div class="glass-card border-l-[6px] ${colores[i % colores.length]} p-6 fade-in" style="animation-delay: ${i * 0.1}s">
                        <div class="flex justify-between items-center mb-5 pb-4 border-b border-slate-100">
                            <div>
                                <h2 class="text-xl font-extrabold text-slate-800">
                                    Package ${p.tipo} #${p.numero} 
                                    <span class="text-sm ${colorMonto} ml-2">($ ${costo.toFixed(2)})</span>
                                </h2>
                                <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Mode: Max ${p.maxMin / 60} hours</p>
                            </div>
                            <span class="font-extrabold text-sm flex items-center gap-3 text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                                <span title="${p.isPaid ? 'Paid' : 'Pending Payment'}" class="flex items-center gap-1">${p.isPaid ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>' : '<i data-lucide="circle-dashed" class="w-4 h-4 text-slate-400"></i>'}</span>
                                <span title="${isComplete ? 'Complete' : 'Incomplete'}" class="flex items-center gap-1">${isComplete ? '<i data-lucide="check-square" class="w-4 h-4 text-purple-500"></i>' : '<i data-lucide="square" class="w-4 h-4 text-slate-300"></i>'}</span>
                                <span class="ml-1">${Math.floor(totalMins/60)}h ${totalMins%60}m</span>
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm">
                                <thead class="text-slate-400 uppercase text-[10px] font-bold tracking-wider">
                                    <tr>
                                        <th class="p-3 text-left">Activity</th>
                                        <th class="p-3 text-center">AI Report</th>
                                        <th class="p-3 text-left">Date</th>
                                        <th class="p-3 text-left">Time</th>
                                        <th class="p-3 text-right">Duration</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${sesionesOrdenadas.map(s => {
                                        const actividadLimpia = s.info.replace('#', '').trim();
                                        const horarioCompleto = `${s.horaInicio}-${s.horaFin}`;
                                        const duracionCompleta = `${Math.floor(s.min/60)} h ${s.min%60} m`;

                                        return `
                                            <tr class="hover:bg-slate-50/50 transition">
                                                <td class="p-3 font-bold text-slate-800">${actividadLimpia}</td>
                                                <td class="p-3 text-center">
                                                    <button onclick="abrirModalIA('${actividadLimpia}', '${s.fecha}', '${horarioCompleto}', '${duracionCompleta}')" 
                                                            class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-extrabold w-9 h-9 rounded-xl flex items-center justify-center transition transform hover:scale-105 active:scale-95 border border-amber-200 mx-auto"
                                                            title="Generate WhatsApp Report">
                                                        <i data-lucide="bot" class="w-4 h-4"></i>
                                                    </button>
                                                </td>
                                                <td class="p-3 text-slate-600 font-medium">${s.fecha}</td>
                                                <td class="p-3 text-slate-600 font-medium whitespace-nowrap">${horarioCompleto}</td>
                                                <td class="p-3 font-bold text-slate-700 text-right whitespace-nowrap">${duracionCompleta}</td>
                                            </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`;
            }).join('');
            
            document.getElementById('studentTotalSoles').innerText = `${ingresosTotales.toFixed(2)} ${student.currency}`;
            lucide.createIcons();
        }

        // Initialize Main Dashboard
        renderMainDashboard();

        // Gemini AI Logic 
        async function fetchGeminiWithBackoff(prompt, retries = 5, delay = 1000) {
            // Replace with real key in production
            const apiKey = "YOUR_API_KEY_HERE"; 
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: {
                    parts: [{ text: "You are an international baccalaureate academic tutor, highly professional, cordial, transparent and organized. You write very polished, formal and informative progress reports in English." }]
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchGeminiWithBackoff(prompt, retries - 1, delay * 2);
                } else {
                    throw error;
                }
            }
        }

        function abrirModalIA(actividad, fecha, horario, duracion) {
            sesionSeleccionada = { actividad, fecha, horario, duracion };
            document.getElementById('modalSubtitulo').innerText = `${actividad} — ${fecha} (${horario})`;
            document.getElementById('inputAvances').value = '';
            document.getElementById('inputAcuerdos').value = '';
            document.getElementById('modalAlerta').classList.add('hidden');
            
            document.getElementById('seccionResultado').classList.add('hidden');
            
            const modal = document.getElementById('modalReporteIA');
            const box = document.getElementById('modalBox');
            modal.classList.remove('hidden');
            
            // Animation
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function cerrarModal() {
            const box = document.getElementById('modalBox');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('modalReporteIA').classList.add('hidden');
            }, 300);
            sesionSeleccionada = null;
        }

        async function generarReporteConGemini() {
            if (!sesionSeleccionada) return;

            const avances = document.getElementById('inputAvances').value.trim();
            const acuerdos = document.getElementById('inputAcuerdos').value.trim();
            const alerta = document.getElementById('modalAlerta');

            if (!avances || !acuerdos) {
                document.getElementById('alertaTexto').innerText = "Please complete both fields (progress and agreements) so the AI can build the message properly.";
                alerta.classList.remove('hidden');
                return;
            }
            alerta.classList.add('hidden');

            const seccionRes = document.getElementById('seccionResultado');
            const textareaResultado = document.getElementById('resultadoIAText');
            const btnConfirmar = document.getElementById('btnConfirmar');
            
            seccionRes.classList.remove('hidden');
            textareaResultado.value = "Thinking and structuring the formal report perfectly... 🤖⏳";
            btnConfirmar.disabled = true;
            btnConfirmar.innerHTML = '<span>Processing...</span> <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
            lucide.createIcons();

            const prompt = `Write a highly formal, professional, structured and cheerful WhatsApp message addressed to the student's parents.
            Report the work done in the following academic session:
            - Activity: ${sesionSeleccionada.actividad}
            - Date: ${sesionSeleccionada.fecha}
            - Time: ${sesionSeleccionada.horario}
            - Duration: ${sesionSeleccionada.duracion}

            Information provided by the tutor:
            - Progress made: "${avances}"
            - Agreements established for the next class: "${acuerdos}"

            Key guidelines:
            1. Greet formally (e.g. "Dear parents, good afternoon...").
            2. Develop the progress with a tone of academic pride.
            3. State the commitments for the next session clearly.
            4. Add professional emojis.
            5. Return EXCLUSIVELY the drafted message to copy directly. Language: English.`;

            const plantillaSeguridad = `Dear Parents, good afternoon. I hope you are doing excellently. 🌟\n\nI am writing to formally report the great progress made in today's session (${sesionSeleccionada.fecha}) of ${sesionSeleccionada.actividad} from ${sesionSeleccionada.horario} (${sesionSeleccionada.duracion}):\n\n📚 Progress achieved:\n${avances}\n\n📈 Agreements for the next session:\n${acuerdos}\n\nThe student continues to show an excellent disposition towards the work. We will continue to make the best use of the time.\n\nThank you as always for your trust. Have a great evening! 🎓✅`;

            try {
                const text = await fetchGeminiWithBackoff(prompt);
                if (text && text.trim()) {
                    textareaResultado.value = text.trim();
                } else {
                    textareaResultado.value = plantillaSeguridad;
                }
            } catch (error) {
                console.warn("Using local fallback template due to API Key issue:", error);
                textareaResultado.value = plantillaSeguridad;
            } finally {
                btnConfirmar.disabled = false;
                btnConfirmar.innerHTML = '<span>Generate with AI</span> <i data-lucide="sparkles" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        }

        function copiarMensajeAlPortapapeles() {
            const textarea = document.getElementById('resultadoIAText');
            textarea.select();
            textarea.setSelectionRange(0, 99999);

            try {
                const copiado = document.execCommand('copy');
                if (copiado) {
                    const btn = document.getElementById('btnCopiar');
                    btn.innerHTML = 'Message Copied! <i data-lucide="check" class="w-4 h-4"></i>';
                    btn.classList.replace('bg-slate-900', 'bg-emerald-600');
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        btn.innerHTML = 'Copy Message <i data-lucide="copy" class="w-4 h-4"></i>';
                        btn.classList.replace('bg-emerald-600', 'bg-slate-900');
                        lucide.createIcons();
                    }, 2500);
                }
            } catch (err) {
                console.error("Failed to copy text", err);
            }
        }
    </script>

            authDomain: "dashboard-alumnos-d974e.firebaseapp.com",
            projectId: "dashboard-alumnos-d974e",
            storageBucket: "dashboard-alumnos-d974e.firebasestorage.app",

        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html'; // Kick out if not logged in
            } else {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().role !== 'admin') {
                    window.location.href = 'index.html'; // Kick out if not admin
                }
            }
        });

        // Sign Out
        document.getElementById('btnSignOut').addEventListener('click', async () => {
            try {
                await signOut(auth);
                // Redirect will be handled by onAuthStateChanged
            } catch (error) {
                console.error('Error signing out', error);
            }
        });
    </script>
